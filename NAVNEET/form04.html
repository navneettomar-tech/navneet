<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Html</title>
</head>
<body>
    <h1>FORM IN HTML</h1>
    <form action="/submit.php">
        <div>
            <label for="Name">Name</label>
            <input type="text" id="Name" placeholder="Enter Name" required>
        </div>
        <div>
            <label for="tel">Phone</label>
            <input type="tel" id="tel" placeholder="Enter Phone" required>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter Email" required>
        </div>
        <div>
            <label for="date">Date Of Birth</label>
            <input type="date" id="date" placeholder="Enter DOB" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>
<div>
    <label for="gender">Gender</label>
    <select id="gender" required>
        <option value="" disabled selected>Select Gender</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
    </select>
</div>
        <p>Choose Subscription Plan</p>
        <label for="basic">Basic</label>
        <input type="radio" id="basic" name="subscription" value="Basic">

        <label for="premium">Premium</label>
        <input type="radio" id="premium" name="subscription" value="Premium">

        <label for="vip">VIP</label>
        <input type="radio" id="vip" name="subscription" value="VIP">
    </div>
<div>
    <label for="terms">I agree to the terms and condition</label>
    <input type="checkbox" id="terms" required>
</div>
<div>
    <label for="comments">Enter Comments</label>
  <textarea name="comments" id="comments" placeholder="Enter Your Comments" rows="4" required>

  </textarea>
<div>
    <button type="submit">Submit</button>
</div>
    </form>
    
</body>
</html>
