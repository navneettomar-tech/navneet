<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Html</title>  
</head>
<body>
    <h1>FOrm in Html</h1>
    <form action="/submit.php">
      <div>
        <label for="name">NAME</label>
        <input id="name" name="text" placeholder="Enter Name" required />
      </div>
      <div>
        <label for="ph">phone</label>
        <input id="ph" type="tel" placeholder="Enter Phone" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter Email" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          required
          />
        </div>
      <div>
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" placeholder="Date" required />
      </div>
      <!-- dropdown (select input)  for gender-->
      <div>
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="" disabled selected>select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <div>
          <p>Subscription Plan</p>
          <input id="basic" type="radio" name="subscription" value="basic" />
          <label for="basic">Basic</label>

          <input id="premium" type="radio" name="subscription" value="premium" />
          <label for="premium">Premium</label>

          <input id="vip" type="radio" name="subscription" value="vip" />
          <label for="vip">VIP</label>
        </div>
        <div>
          <input id="terms" type="checkbox" required />
          <label for="terms">I agree to the terms and conditions</label>
        </div>
        <div>
          <label for="comments">Comments</label>
          <textarea id="comments" placeholder="Enter your comments"rows="4"></textarea>

        </div>
        <div>
          <button type="submit">Submit</button>
        </div>
     </form>
  </body>
</html>
