<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        table {
            width: 100%;
            max-width: 700px;
            background-color: white;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        caption {
            background-color: #0077b6;
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
        }

        thead {
            background-color: #023e8a;
            color: white;
        }

        th, td {
            padding: 16px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            font-size: 17px;
            letter-spacing: 1px;
        }

        tbody tr:nth-child(even) {
            background-color: #eaf4ff;
        }

        tbody tr:hover {
            background-color: #caf0f8;
            transition: 0.3s;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td {
            color: #222;
            font-size: 16px;
        }

        @media (max-width: 480px) {
            th, td {
                padding: 12px 8px;
                font-size: 14px;
            }

            caption {
                font-size: 23px;
            }
        }
        </style>
</head>
<body>
    <table>
        <caption>Score Board</caption>
        <thead>
            <tr>
                <th>Player</th>
                <th>Score</th>
                <th>Match</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Rohit</td>
                <td>100</td>
                <td>IPL</td>
            </tr>
            <tr>
                <td>Virat Kohli</td>
                <td>150</td>
                <td>T20</td>
            </tr>
            <tr>
                <td>MS Dhoni</td>
                <td>120</td>
                <td>ODI</td>
            </tr>
            
            <tr>
                <td>krish gel</td>
                <td>120</td>
                <td>ODI</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
