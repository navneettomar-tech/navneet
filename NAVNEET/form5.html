<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Form</title>
</head>
<body>
    <h1>FORM IN HTML</h1>
    <form action="/document.php">
        <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Number" required/>
        </div>
        <div>
            <label for="tel">Phone</label>
        <input type="tel" id="tel" name="phone" required placeholder="Enter Phone"/>
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter Email" required/>
        </div>
        <div>
            <label for="password">Password</label>
         <input type="password" id="password" name="password" placeholder="Enter Password"/>
        </div>
        <div>
            <label for="date">Date Of Birth</label>
            <input type="date" id="date" name="date" placeholder="Enter DOB" required/>
        </div>
        <div>
            <label for="gender">Gender</label>
        
            <select name="gender" id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male" >Male</option>
                <option value="female" >Female</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <label for="terms">I am agree to the terms and conditions</label>
            <input type="checkbox" name="terms" id="terms"/>
        </div>
        <div>
            <p>Subscription Plan</p>
            <label for="Basic">Basic</label>
            <input type="radio" id="basic" name="subscription" value="basic">
            <label for="premium">Premium</label>
            <input type="radio" id="premium" name="subscription" value="premium">
            <label for="vip">VIP</label>
            <input type="radio" id="vip" name="subscription" value="VIP"/>
            <div>
                <label for="comments">Comments</label>
                <textarea name="comments" id="comments" rows="3">Your Comments</textarea>
            </div>
            <div>
                <button type="submit">Submit</button>
            </div>

        </div>
    </form>
    
</body>
</html>
